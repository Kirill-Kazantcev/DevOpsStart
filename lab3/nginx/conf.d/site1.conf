# site1.local - перенаправление HTTP на HTTPS
server {
    listen 80;
    server_name site1.local www.site1.local;
    return 301 https://$server_name$request_uri;
}

# site1.local - HTTPS с alias
server {
    listen 443 ssl;
    server_name site1.local www.site1.local;

    # SSL сертификаты
    ssl_certificate /etc/nginx/ssl/site1.crt;
    ssl_certificate_key /etc/nginx/ssl/site1.key;

    # Основной корень сайта
    location / {
        root /var/www/site1;
        index index.html;
    }

    # Alias для псевдонима пути
    location /images/ {
        alias /var/www/site1/static/;
    }

    # Скрытая админка (уязвимость для path traversal)
    location /admin {
        alias /var/www/site1/admin/;
    }

    # Запрет доступа к .txt файлам (попытка защиты)
    location ~ \.txt$ {
        deny all;
        return 403;
    }
}
