# site2.local - перенаправление HTTP на HTTPS
server {
    listen 80;
    server_name site2.local www.site2.local;
    return 301 https://$server_name$request_uri;
}

# site2.local - HTTPS
server {
    listen 443 ssl;
    server_name site2.local www.site2.local;

    # SSL сертификаты
    ssl_certificate /etc/nginx/ssl/site2.crt;
    ssl_certificate_key /etc/nginx/ssl/site2.key;

    # Основной корень сайта
    location / {
        root /var/www/site2;
        index index.html;
    }
}
